<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>형용사 감성 사진 공유하기</title>
<style>
body{margin:0;background:#fff7fb;color:#3a2a30;font:16px/1.45 system-ui,"Noto Sans KR","Noto Sans JP",sans-serif}
main{max-width:680px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:6px 0 2px;color:#d9467a}p.s{margin:0 0 10px;color:#7a6168;font-size:14px}
section{background:#fff;border:1px solid #f1d3df;border-radius:14px;padding:10px 12px;margin:10px 0}
b{display:block;margin-bottom:6px}
input,select,textarea,button,.btn{font:inherit;border:1px solid #e3b9ca;border-radius:10px;padding:9px 11px;background:#fff;box-sizing:border-box}
input,textarea,select{width:100%}textarea{resize:vertical;margin-top:6px}
button,.btn{cursor:pointer;display:inline-block;margin:6px 4px 2px 0;width:auto;text-align:center}
.go{background:#d9467a;color:#fff;border-color:#d9467a;font-weight:700}
.ok{font-size:14px;color:#2e7d32;margin-left:4px}
canvas{cursor:pointer;width:100%;height:auto;border-radius:14px;border:1px solid #f1d3df;background:#fff}
</style></head><body><main>
<h1>형용사 감성 사진 공유하기</h1>
<p class="s">형용사 3개를 골라, 칸마다 사진을 찍고 일본어 문장을 써서 카드 한 장을 만들어요.</p>
<section><b>이름</b><input id="nm" placeholder="학년-반 번호 이름 (예: 2-8 12 김하나)"></section>
<div id="slots"></div>
<canvas id="cv" width="1080" height="1300"></canvas>
<p class="s" style="margin:4px 2px">카드의 형용사, 사진, 문장 부분을 눌러도 입력할 수 있어요.</p>
<section><button id="sv" class="go">💾 카드 이미지로 저장</button>
<a id="go" class="btn" target="_blank" rel="noopener" style="display:none;text-decoration:none;color:inherit">📤 제출하러 가기</a>
<p class="s" style="margin:6px 0 0">저장한 이미지를 선생님이 알려 주신 곳(패들렛 등)에 올려서 제출하세요. 저장이 안 되면 카드를 길게 눌러 저장하세요. 사진은 이 기기 밖으로 나가지 않아요.</p></section>
</main>
<script>
// ★ 선생님 설정 ★ 형용사 목록: [일본어, 한국어 뜻, 예문]  /  제출 주소(패들렛 등)를 따옴표 안에 붙여 넣으면 '제출하러 가기' 버튼이 나타납니다.
const SUBMIT_URL="";
const ADJ=[["あつい","덥다","このてんきは あついです。"],["おいしい","맛있다","この ケーキは おいしいです。"],["たかい","높다 / 비싸다","この ビルは たかいです。"],
["うまい","맛있다 / 솜씨가 좋다","この すしは うまいです。"],["からい","맵다","この ラーメンは からいです。"],["やすい","싸다","この かばんは やすいです。"],
["さむい","춥다","ふゆは さむいです。"],["すきだ","좋아하다","わたしは いぬが すきです。"],["じょうずだ","잘하다","わたしは うたが じょうずです。"],
["だいすきだ","아주 좋아하다","わたしは ねこが だいすきです。"],["きれいだ","예쁘다 / 깨끗하다","さくらが とても きれいです。"],["すてきだ","멋지다","この ぼうしは すてきです。"],
["ふるい","오래되다 / 낡다","この ほんは ふるいです。"],["にぎやかだ","번화하다","この まちは にぎやかです。"],["ひろい","넓다","この こうえんは ひろいです。"],
["ゆうめいだ","유명하다","ならこうえんは ゆうめいです。"]];
const N=3,W=1080,H=1300,DEF=[10,0,4];            // 칸 수, 카드 크기, 처음에 보이는 형용사(きれいだ・あつい・からい)
const $=id=>document.getElementById(id),cv=$('cv'),c=cv.getContext('2d'),F='"Noto Sans JP","Noto Sans KR","Hiragino Sans","Malgun Gothic",sans-serif';
const COL=['#ffd1e3','#ffe3b0','#e3d3ff'],TILT=[-.06,.025,.05],CX=[180,540,900],photo=[null,null,null];
if(SUBMIT_URL){$('go').href=SUBMIT_URL;$('go').style.display='inline-block'}

for(let i=0;i<N;i++){const s=document.createElement('section');
 s.innerHTML='<b>'+(i+1)+'번째 칸</b><select id="adj'+i+'"></select>'+
 '<div><label class="btn">📷 카메라로 찍기<input type="file" accept="image/*" capture="environment" id="cam'+i+'" hidden></label>'+
 '<label class="btn">🖼 사진 고르기<input type="file" accept="image/*" id="pic'+i+'" hidden></label><span class="ok" id="ok'+i+'"></span></div>'+
 '<textarea id="sen'+i+'" rows="2" placeholder="여기에 문장을 써 봅시다."></textarea><button id="ex'+i+'">예문 넣기</button>';
 $('slots').append(s);
 const sel=$('adj'+i);ADJ.forEach((a,k)=>{const o=document.createElement('option');o.value=k;o.textContent=a[0]+' ('+a[1]+')';sel.append(o)});sel.value=DEF[i];
 sel.addEventListener('input',()=>{opts();R()});$('sen'+i).addEventListener('input',R);
 $('ex'+i).onclick=()=>{$('sen'+i).value=ADJ[$('adj'+i).value][2];R()};
 const ld=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{photo[i]=im;$('ok'+i).textContent='✓ 사진 선택됨';R()};im.src=URL.createObjectURL(f)};
 $('cam'+i).onchange=ld;$('pic'+i).onchange=ld}
$('nm').addEventListener('input',R);
function opts(){const used=[0,1,2].map(i=>$('adj'+i).value);for(let i=0;i<N;i++)[...$('adj'+i).options].forEach(o=>{o.disabled=used.some((v,j)=>j!=i&&v==o.value)})}   // 같은 형용사는 한 번만
opts();

function bl(x,y,r,rot){c.save();c.translate(x,y);c.rotate(rot);c.fillStyle='#ffc7dc';c.strokeStyle='#ffa6c6';c.lineWidth=2;for(let k=0;k<5;k++){c.rotate(Math.PI*2/5);c.beginPath();c.ellipse(0,-r*.55,r*.42,r*.55,0,0,7);c.fill();c.stroke()}c.fillStyle='#ffe27a';c.beginPath();c.arc(0,0,r*.2,0,7);c.fill();c.restore()}
function rr(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function pill(x,y,w,h,col){c.save();c.shadowColor='rgba(120,70,100,.25)';c.shadowBlur=18;c.shadowOffsetY=6;rr(x,y,w,h,h/2);c.fillStyle=col;c.fill();c.restore();rr(x,y,w,h,h/2);c.lineWidth=8;c.strokeStyle='#fff';c.stroke()}
function txt(t,x,y,s,col,mw){let z=s;c.font='700 '+z+'px '+F;if(mw)while(c.measureText(t).width>mw&&z>18){z-=2;c.font='700 '+z+'px '+F}c.fillStyle=col||'#3a2a30';c.textAlign='center';c.textBaseline='middle';c.fillText(t,x,y)}
function lines(t,s,mw){c.font='700 '+s+'px '+F;const out=[];t.split('\n').forEach(p=>{let ln='';p.split(' ').forEach(w=>{const tr=ln?ln+' '+w:w;if(c.measureText(tr).width<=mw||!ln)ln=tr;else{out.push(ln);ln=w}});out.push(ln)});
 return out.flatMap(l=>{if(c.measureText(l).width<=mw)return[l];const r=[];let q='';for(const ch of l){if(c.measureText(q+ch).width>mw){r.push(q);q=ch}else q+=ch}r.push(q);return r})}

function R(){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#dcebff');g.addColorStop(.55,'#fdeaf3');g.addColorStop(1,'#f3e9ff');c.fillStyle=g;c.fillRect(0,0,W,H);
 let s=7;const rnd=()=>(s=s*16807%2147483647)/2147483647;for(let i=0;i<30;i++)bl(rnd()*W,rnd()*H,14+rnd()*24,rnd()*6);
 pill(150,36,780,92,'#ffd1e3');txt('형용사 감성 사진 공유하기',540,84,44,'#4a2c3a');
 for(let i=0;i<N;i++){const a=ADJ[$('adj'+i).value],cx=CX[i];
  pill(cx-165,168,330,168,COL[i]);txt(a[0],cx,236,76,'#3a2a30',280);txt('('+a[1]+')',cx,304,32,'#5a4650',280);
  c.save();c.translate(cx,640);c.rotate(TILT[i]);c.shadowColor='rgba(80,50,70,.3)';c.shadowBlur=22;c.shadowOffsetY=10;c.fillStyle='#fff';c.fillRect(-160,-225,320,450);c.shadowColor='transparent';
  c.beginPath();c.rect(-146,-211,292,422);c.clip();const p=photo[i];
  if(p){const k=Math.max(292/p.width,422/p.height);c.drawImage(p,-p.width*k/2,-p.height*k/2,p.width*k,p.height*k)}
  else{c.fillStyle='#eef3fb';c.fillRect(-146,-211,292,422);txt('📷',0,-50,88);txt('사진을 골라요',0,50,34,'#8a9bb5',260);txt('(여기를 눌러요)',0,100,26,'#a9b6cc',260)}
  c.restore();
  rr(cx-165,900,330,310,30);c.fillStyle='#fff6ea';c.fill();c.setLineDash([12,9]);c.lineWidth=4;c.strokeStyle='#f2b8a4';c.stroke();c.setLineDash([]);
  const v=$('sen'+i).value.trim(),t=v||'여기에 문장을 써 봅시다.';let sz=54,L,fit=null;for(;sz>24;sz-=3){L=lines(t,sz,290);if(L.length*sz*1.3<=240){if(!fit)fit=[sz,L];if(L.length==1||L[L.length-1].length>2){fit=[sz,L];break}}}if(fit){sz=fit[0];L=fit[1]}
  const lh=sz*1.3,y0=1045-(L.length-1)*lh/2;L.forEach((l,k)=>txt(l,cx,y0+k*lh,sz,v?'#3a2a30':'#b9a9a0'));
  c.strokeStyle=['#f48fb1','#f6a46a','#b39ddb'][i];c.lineWidth=5;c.lineCap='round';c.beginPath();c.moveTo(cx-90,1180);c.lineTo(cx+90,1180);c.stroke()}
 txt($('nm').value.trim(),540,1262,34,'#6b5560',900)}

$('sv').onclick=()=>{const a=document.createElement('a');a.download='형용사카드_'+($('nm').value.trim()||'이름없음').replace(/[\\/:*?"<>|\s]+/g,'_')+'.png';a.href=cv.toDataURL('image/png');document.body.append(a);a.click();a.remove()};
cv.onclick=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height,i=Math.min(N-1,Math.max(0,Math.floor(x/(W/N))));
 if(y>370&&y<890)$('pic'+i).click();
 else if(y>=890&&y<1230){const t=$('sen'+i);t.scrollIntoView({block:'center'});t.focus()}
 else if(y>150&&y<=370){const t=$('adj'+i);t.scrollIntoView({block:'center'});t.focus()}};
R();
</script></body></html>
